<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .hero-pattern { background-color: #4338ca; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%); }
        #galleryOverlay img { max-height: 80vh; object-fit: contain; }
        .qr-frame { border: 8px solid white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .heart-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .heart-btn:active { transform: scale(1.4); }
    </style>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fas fa-home"></i></div>
                <h1 class="text-xl font-extrabold tracking-tight">Rent<span class="text-indigo-600">Connect</span></h1>
            </div>
            <div class="flex items-center gap-4 relative">
                <div id="coinDisplay" onclick="toggleModal('buyCoinsModal')" class="cursor-pointer hidden md:flex items-center bg-amber-50 border border-amber-200 px-4 py-2 rounded-full gap-2 hover:bg-amber-100 transition">
                    <i class="fas fa-coins text-amber-500"></i><span id="userCoins" class="font-bold text-amber-700 text-sm">0</span>
                    <i class="fas fa-plus-circle text-amber-400 text-[10px]"></i>
                </div>
                <button onclick="handlePostPropertyClick()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition hover:bg-indigo-700">Post Property</button>
                <div class="relative inline-block">
                    <button id="loginBtn" onclick="toggleModal('authModal')" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg">Sign In</button>
                    <div id="userMenu" class="hidden absolute right-0 mt-3 w-48 bg-white border border-slate-100 rounded-2xl shadow-2xl py-2 z-[300]">
                        <a href="dashboard.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50"><i class="fas fa-th-large mr-2 text-indigo-600"></i> Dashboard</a>
                        <button onclick="logout()" class="w-full text-left px-4 py-3 text-sm font-bold text-rose-500 hover:bg-rose-50"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="buyCoinsModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[400] p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm text-center relative shadow-2xl">
            <button onclick="toggleModal('buyCoinsModal')" class="absolute top-6 right-6 text-slate-300 text-2xl transition hover:text-rose-500">&times;</button>
            <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-500 text-3xl shadow-inner"><i class="fas fa-coins"></i></div>
            <h3 class="text-2xl font-black mb-2 text-slate-900">Get More Coins</h3>
            <p class="text-slate-500 text-sm mb-6 px-4">Get 3 coins for just ₹299.</p>
            <div class="mb-6 flex flex-col items-center">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=9686995600@ybl%26pn=SoulShiftMedia%26am=299%26cu=INR" class="qr-frame rounded-2xl mb-3" alt="UPI QR Code">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Scan to Pay ₹299</p>
            </div>
            <a href="upi://pay?pa=9686995600@ybl&pn=SoulShiftMedia&am=299&cu=INR" class="block w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg mb-4 hover:scale-[1.02] transition transform">Pay via App</a>
            <div class="border-t pt-4 mt-2">
                <p class="text-xs text-slate-400 mb-3 font-medium text-center">Payment done?</p>
                <button onclick="requestCoinCredit()" class="w-full bg-emerald-500 text-white p-3 rounded-xl font-bold text-sm shadow-md hover:bg-emerald-600 transition">I have paid, Add Coins</button>
            </div>
        </div>
    </div>

    <section class="hero-pattern text-white py-24 px-6 text-center">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Find your next home <br/><span class="text-indigo-300">without brokerage.</span></h2>
        <input type="text" style="display:none"><input type="password" style="display:none">
        <div class="bg-white rounded-2xl p-2 shadow-2xl flex flex-col md:flex-row gap-2 max-w-3xl mx-auto">
            <input type="text" id="mainPropertySearch" autocomplete="new-password" oninput="filterProperties()" placeholder="Search Locality, Mumbai, Bangalore..." class="flex-1 px-6 py-4 text-slate-800 rounded-xl outline-none text-lg">
            <button onclick="filterProperties()" class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold transition hover:bg-indigo-700">Search</button>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <h3 class="text-2xl font-bold text-slate-800 mb-8">Verified Metro Listings</h3>
        <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="postModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[400] p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-3xl max-h-[90vh] overflow-y-auto relative shadow-2xl">
            <button onclick="toggleModal('postModal')" class="absolute top-6 right-6 text-slate-400 hover:text-rose-500 text-3xl transition">&times;</button>
            <h3 class="text-3xl font-black mb-2 text-slate-900">List Your Property</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div class="md:col-span-2">
                    <label class="text-xs font-bold uppercase text-slate-400 ml-1">Title</label>
                    <input type="text" id="title" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-transparent focus:border-indigo-500 transition">
                </div>
                <div class="md:col-span-2">
                    <label class="text-xs font-bold uppercase text-slate-400 ml-1">Type</label>
                    <select id="bhkType" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border focus:border-indigo-500 transition">
                        <option value="1 RK">1 RK</option><option value="1 BHK">1 BHK</option><option value="2 BHK">2 BHK</option><option value="3 BHK">3 BHK</option><option value="Shop/Commercial">Shop/Commercial</option>
                    </select>
                </div>
                <div><label class="text-xs font-bold uppercase text-slate-400 ml-1">Pincode</label><input type="number" id="pincode" onkeyup="autoFillLocation(this.value)" class="w-full bg-slate-50 p-4 rounded-2xl outline-none"></div>
                <div><label class="text-xs font-bold uppercase text-slate-400 ml-1">Locality</label><input type="text" id="locality" class="w-full bg-slate-100 p-4 rounded-2xl outline-none" readonly></div>
                <div><input type="text" id="district" class="hidden"><input type="text" id="state" class="hidden"></div>
                <div><label class="text-xs font-bold uppercase text-slate-400 ml-1">House No</label><input type="text" id="houseNo" class="w-full bg-slate-50 p-4 rounded-2xl outline-none"></div>
                <div><label class="text-xs font-bold uppercase text-slate-400 ml-1">Floor</label><input type="text" id="floorNo" class="w-full bg-slate-50 p-4 rounded-2xl outline-none"></div>
                <div class="md:col-span-2"><label class="text-xs font-bold uppercase text-slate-400 ml-1">Street</label><input type="text" id="street" class="w-full bg-slate-50 p-4 rounded-2xl outline-none"></div>
                <div><label class="text-xs font-bold uppercase text-slate-400 ml-1">Rent</label><input type="number" id="rent" class="w-full bg-slate-50 p-4 rounded-2xl outline-none"></div>
                <div><label class="text-xs font-bold uppercase text-slate-400 ml-1">Owner WhatsApp</label><input type="text" id="phone" class="w-full bg-slate-50 p-4 rounded-2xl outline-none"></div>
                <div class="md:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-4 py-2">
                    <select id="furnishing" class="w-full bg-slate-50 p-3 rounded-xl outline-none"><option value="Unfurnished">Unfurnished</option><option value="Semi-Furnished">Semi-Furnished</option><option value="Fully Furnished">Fully Furnished</option></select>
                    <div class="flex items-center gap-2 pt-6"><input type="checkbox" id="parking" class="w-5 h-5 accent-indigo-600"><label class="text-sm font-bold">Parking</label></div>
                    <div class="flex items-center gap-2 pt-6"><input type="checkbox" id="water" class="w-5 h-5 accent-indigo-600"><label class="text-sm font-bold">Water</label></div>
                </div>
                <div class="md:col-span-2"><input type="file" id="multiImages" multiple class="w-full text-sm text-slate-500 mt-2"></div>
                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-xl hover:bg-indigo-700 transition transform hover:scale-[1.01]">List Property & Earn 3 Coins</button>
            </div>
        </div>
    </div>

    <div id="galleryOverlay" class="fixed inset-0 bg-black/95 hidden z-[300] flex flex-col justify-center items-center p-4">
        <button onclick="closeGallery()" class="absolute top-6 right-6 text-white text-4xl">&times;</button>
        <div class="relative w-full max-w-5xl flex items-center justify-center">
            <button onclick="prevImg()" class="absolute left-0 text-white bg-white/10 p-4 rounded-full hover:bg-white/20 transition"><i class="fas fa-chevron-left"></i></button>
            <img id="galleryImg" src="" class="rounded-xl shadow-2xl">
            <button onclick="nextImg()" class="absolute right-0 text-white bg-white/10 p-4 rounded-full hover:bg-white/20 transition"><i class="fas fa-chevron-right"></i></button>
        </div>
        <p id="galleryCounter" class="text-white/50 mt-6 font-bold"></p>
    </div>

    <div id="authModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[200] p-4 backdrop-blur-md">
        <div class="bg-white p-10 rounded-[2.5rem] w-full max-w-md relative shadow-2xl text-center">
            <button onclick="toggleModal('authModal')" class="absolute top-6 right-6 text-slate-300 text-2xl">&times;</button>
            <h3 id="authTitle" class="text-3xl font-black mb-6 text-slate-900">Join RentConnect</h3>
            <div class="space-y-4">
                <div id="nameFields" class="grid grid-cols-2 gap-4">
                    <input type="text" id="authFirstName" placeholder="First Name" class="bg-slate-50 p-4 rounded-xl outline-none">
                    <input type="text" id="authLastName" placeholder="Last Name" class="bg-slate-50 p-4 rounded-xl outline-none">
                </div>
                <input type="email" id="authEmail" placeholder="Email" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <input type="text" id="authPhone" placeholder="WhatsApp No." class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <input type="password" id="authPassword" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg transition hover:bg-indigo-700">Continue</button>
                <p class="text-center text-sm mt-4"><button onclick="toggleAuthMode()" class="text-indigo-600 font-bold hover:underline transition">Switch Login/Signup</button></p>
            </div>
        </div>
    </div>

    <footer class="py-12 text-center border-t border-slate-200 mt-20">
        <p class="text-slate-400 text-xs font-medium">© 2026 Soul Shift Media | Mumbai · Bangalore · Chennai</p>
        <a href="admin.html" class="text-slate-200 hover:text-indigo-400 transition mt-3 text-[10px] inline-block font-bold">Admin Center</a>
    </footer>

    <script>
        let isSignUp = true;
        let currentPropImages = [];
        let currentImgIdx = 0;

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function logout() { localStorage.clear(); location.reload(); }
        function toggleAuthMode() { isSignUp = !isSignUp; document.getElementById('nameFields').style.display = isSignUp ? "grid" : "none"; document.getElementById('authPhone').style.display = isSignUp ? "block" : "none"; }
        
        function handlePostPropertyClick() {
            if(!localStorage.getItem('userEmail')) { toggleModal('authModal'); } else { toggleModal('postModal'); }
        }

        async function toggleWishlist(propId) {
            const email = localStorage.getItem('userEmail');
            if(!email) { toggleModal('authModal'); return; }
            const res = await fetch('/api/wishlist/toggle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, propId }) });
            const data = await res.json();
            if(data.ok) {
                localStorage.setItem('wishlist', JSON.stringify(data.wishlist));
                loadData(); // Re-render to update UI
            }
        }

        async function requestCoinCredit() {
            const email = localStorage.getItem('userEmail');
            fetch("https://formspree.io/f/xojnwzlg", { method: "POST", headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ subject: "UPI VERIFICATION", message: `User ${email} claims paid.` }) });
            alert("Request sent!"); toggleModal('buyCoinsModal');
        }

        async function autoFillLocation(pin) {
            if(pin.length === 6) {
                const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                const data = await res.json();
                if(data[0].Status === "Success") {
                    document.getElementById('locality').value = data[0].PostOffice[0].Name;
                    document.getElementById('district').value = data[0].PostOffice[0].District;
                    document.getElementById('state').value = data[0].PostOffice[0].State;
                }
            }
        }

        async function handleAuth() {
            const body = { firstName: document.getElementById('authFirstName').value, lastName: document.getElementById('authLastName').value, email: document.getElementById('authEmail').value, password: document.getElementById('authPassword').value, phone: document.getElementById('authPhone').value };
            const res = await fetch(isSignUp ? '/api/signup' : '/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('userName', data.firstName);
                localStorage.setItem('userEmail', data.email);
                localStorage.setItem('userCoins', data.coins);
                localStorage.setItem('unlocked', JSON.stringify(data.unlocked || []));
                localStorage.setItem('wishlist', JSON.stringify(data.wishlist || []));
                location.reload();
            } else { alert(data.error); }
        }

        async function submitProperty() {
            const formData = new FormData();
            formData.append('ownerEmail', localStorage.getItem('userEmail'));
            formData.append('title', document.getElementById('title').value);
            formData.append('bhkType', document.getElementById('bhkType').value);
            formData.append('locality', document.getElementById('locality').value);
            formData.append('district', document.getElementById('district').value);
            formData.append('state', document.getElementById('state').value);
            formData.append('pincode', document.getElementById('pincode').value);
            formData.append('houseNo', document.getElementById('houseNo').value);
            formData.append('floorNo', document.getElementById('floorNo').value);
            formData.append('street', document.getElementById('street').value);
            formData.append('rent', document.getElementById('rent').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('furnishing', document.getElementById('furnishing').value);
            formData.append('parking', document.getElementById('parking').checked);
            formData.append('water', document.getElementById('water').checked);
            const files = document.getElementById('multiImages').files;
            for(let i=0; i<files.length; i++) formData.append('images', files[i]);
            await fetch('/api/properties', { method: 'POST', body: formData });
            alert("Sent for verification!"); location.reload();
        }

        function filterProperties() {
            const term = document.getElementById('mainPropertySearch').value.toLowerCase();
            document.querySelectorAll('#property-list > div').forEach(card => { card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none"; });
        }

        function openGallery(imagesJson) { currentPropImages = JSON.parse(decodeURIComponent(imagesJson)); currentImgIdx = 0; updateGalleryUI(); document.getElementById('galleryOverlay').classList.remove('hidden'); }
        function closeGallery() { document.getElementById('galleryOverlay').classList.add('hidden'); }
        function updateGalleryUI() { document.getElementById('galleryImg').src = currentPropImages[currentImgIdx]; document.getElementById('galleryCounter').innerText = `Image ${currentImgIdx + 1} of ${currentPropImages.length}`; }
        function nextImg() { currentImgIdx = (currentImgIdx + 1) % currentPropImages.length; updateGalleryUI(); }
        function prevImg() { currentImgIdx = (currentImgIdx - 1 + currentPropImages.length) % currentPropImages.length; updateGalleryUI(); }

        async function loadData() {
            const userEmail = localStorage.getItem('userEmail');
            if(userEmail) {
                try {
                    const syncRes = await fetch(`/api/user-sync/${userEmail}`);
                    const syncData = await syncRes.json();
                    if(syncRes.ok) {
                        localStorage.setItem('userCoins', syncData.coins);
                        localStorage.setItem('unlocked', JSON.stringify(syncData.unlocked));
                        localStorage.setItem('wishlist', JSON.stringify(syncData.wishlist));
                        document.getElementById('userCoins').innerText = syncData.coins;
                    }
                } catch(e) {}
            }

            const res = await fetch('/api/properties');
            const props = await res.json();
            const list = document.getElementById('property-list');
            const unlockedList = JSON.parse(localStorage.getItem('unlocked') || "[]");
            const wishlist = JSON.parse(localStorage.getItem('wishlist') || "[]");
            list.innerHTML = '';
            
            props.forEach(p => {
                const imgsData = encodeURIComponent(JSON.stringify(p.images));
                const isUnlocked = unlockedList.includes(p._id);
                const isWishlisted = wishlist.includes(p._id);
                list.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden p-4 relative">
                        <button onclick="toggleWishlist('${p._id}')" class="heart-btn absolute top-6 left-6 z-10 w-10 h-10 bg-white/90 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg border border-slate-100">
                            <i class="${isWishlisted ? 'fas' : 'far'} fa-heart text-${isWishlisted ? 'rose-500' : 'slate-400'}"></i>
                        </button>
                        <div class="relative cursor-pointer group" onclick="openGallery('${imgsData}')">
                            <img src="${p.images[0]}" class="w-full h-48 object-cover rounded-2xl mb-4 group-hover:opacity-90 transition shadow-inner">
                            <div class="absolute bottom-6 right-3 bg-black/50 text-white text-[10px] px-3 py-1 rounded-full backdrop-blur-md"><i class="fas fa-camera mr-1"></i> ${p.images.length} Photos</div>
                            <div class="absolute top-3 left-10 bg-white/90 text-indigo-600 text-[10px] px-3 py-1 rounded-full font-black shadow-lg border border-indigo-100 uppercase ml-4">${p.bhkType}</div>
                            <div class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] px-3 py-1.5 rounded-full font-bold shadow-lg">Vacant: ${p.vacantDate}</div>
                        </div>
                        <h4 class="font-bold text-lg text-slate-800 truncate">${p.title}</h4>
                        <div class="flex justify-between items-center mt-1 mb-2"><p class="text-indigo-600 font-extrabold text-xl">₹${p.rent}</p><p class="text-slate-400 text-xs">${p.locality}</p></div>
                        <p class="text-[10px] text-slate-400 font-bold mb-4"><i class="fas fa-heart text-rose-400 mr-1"></i> ${p.likesCount || 0} people saved this</p>
                        <button onclick="${isUnlocked ? `window.open('https://wa.me/${p.phone}')` : `unlockContact(event, '${p.phone}', '${p._id}')`}" 
                                class="w-full ${isUnlocked ? 'bg-green-600' : 'bg-slate-900'} text-white p-4 rounded-xl font-bold shadow-lg hover:scale-[1.01] transition">
                            ${isUnlocked ? `<i class="fab fa-whatsapp"></i> ${p.phone}` : 'Unlock Contact (1 Coin)'}
                        </button>
                    </div>
                `);
            });
        }

        async function unlockContact(e, phone, propId) {
            if(parseInt(localStorage.getItem('userCoins')) < 1) { toggleModal('buyCoinsModal'); return; }
            if(confirm("Unlock for 1 Coin?")) {
                const res = await fetch('/api/spend-coin', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: localStorage.getItem('userEmail'), amount: 1, description: "Contact Unlock", propId }) });
                const data = await res.json();
                if(res.ok) { localStorage.setItem('userCoins', data.newBalance); location.reload(); }
            }
        }

        window.onload = () => {
            const name = localStorage.getItem('userName');
            if(name) {
                document.getElementById('coinDisplay').classList.remove('hidden');
                document.getElementById('userCoins').innerText = localStorage.getItem('userCoins');
                const loginBtn = document.getElementById('loginBtn');
                loginBtn.innerHTML = `<i class="fas fa-user-circle mr-2"></i> Hi, ${name}`;
                loginBtn.onclick = () => document.getElementById('userMenu').classList.toggle('hidden');
            }
            loadData();
        };
    </script>
</body>
</html>

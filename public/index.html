<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .hero-pattern { background-color: #4338ca; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%); }
        .admin-only { display: none; }
        .admin-mode .admin-only { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="glass-nav border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fas fa-home"></i></div>
                <h1 class="text-xl font-extrabold tracking-tight">Rent<span class="text-indigo-600">Connect</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="coinDisplay" class="hidden md:flex items-center bg-amber-50 border border-amber-200 px-4 py-2 rounded-full gap-3">
                    <div class="flex items-center gap-1.5"><i class="fas fa-coins text-amber-500"></i><span class="font-bold text-amber-700 text-sm" id="userCoins">0</span></div>
                    <button class="bg-amber-500 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase">Add Coins</button>
                </div>
                <button onclick="toggleModal('postModal')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">Post Property</button>
                <button onclick="toggleModal('authModal')" id="loginBtn" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold">Sign In</button>
            </div>
        </div>
    </nav>

    <section class="hero-pattern text-white py-20 px-6">
        <div class="container mx-auto text-center max-w-4xl">
            <h2 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight text-center">Find your next home <br/><span class="text-indigo-300">without brokerage.</span></h2>
            <div class="bg-white rounded-2xl p-2 shadow-2xl flex flex-col md:flex-row gap-2 max-w-3xl mx-auto">
                <input type="text" id="searchInput" placeholder="Enter Locality or Pincode..." class="flex-1 px-6 py-4 text-slate-800 rounded-xl outline-none text-lg">
                <button class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold">Search</button>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <h3 class="text-2xl font-bold text-slate-800 mb-8">Verified Listings</h3>
        <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <section id="adminSection" class="admin-only mt-20 border-t-4 border-indigo-600 pt-10">
            <h2 class="text-2xl font-black mb-4">Pending Verification</h2>
            <div id="pending-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
    </main>

    <div id="authModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[200] p-4 backdrop-blur-md">
        <div class="bg-white p-10 rounded-[2.5rem] w-full max-w-md relative">
            <button onclick="toggleModal('authModal')" class="absolute top-6 right-6 text-slate-300 hover:text-slate-600 text-2xl">&times;</button>
            <h3 class="text-3xl font-black mb-2" id="authTitle">Join RentConnect</h3>
            <p class="text-slate-500 mb-8" id="authSubtitle text-sm">Earn 3 coins for every verified listing.</p>
            <div class="space-y-4">
                <input type="email" id="authEmail" placeholder="Email Address" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <input type="text" id="authPhone" placeholder="Mobile Number" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <input type="password" id="authPassword" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg" id="authBtn">Create Account</button>
            </div>
            <p class="mt-6 text-center text-sm text-slate-400">Already have an account? <button onclick="toggleAuthMode()" class="text-indigo-600 font-bold" id="toggleBtn">Sign In</button></p>
        </div>
    </div>

    <div id="postModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6"><h3 class="text-2xl font-black">List Property</h3><button onclick="toggleModal('postModal')" class="text-2xl">&times;</button></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="title" placeholder="Title" class="md:col-span-2 bg-slate-50 p-4 rounded-xl outline-none">
                <input type="number" id="pincode" onkeyup="autoFillAddress(this.value)" placeholder="Pincode" class="bg-slate-50 p-4 rounded-xl outline-none">
                <input type="text" id="locality" placeholder="Locality" class="bg-slate-100 p-4 rounded-xl outline-none" readonly>
                <input type="text" id="phone" placeholder="WhatsApp Number" class="bg-slate-50 p-4 rounded-xl outline-none">
                <input type="number" id="rent" placeholder="Rent (₹)" class="bg-slate-50 p-4 rounded-xl outline-none">
                <div class="md:col-span-2"><input type="file" id="multiImages" multiple class="text-sm"></div>
                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-xl">Submit & Earn 3 Coins</button>
            </div>
        </div>
    </div>

    <script>
        let isSignUp = true;
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? "Join RentConnect" : "Welcome Back";
            document.getElementById('authBtn').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('authPhone').style.display = isSignUp ? "block" : "none";
        }

        async function autoFillAddress(pin) {
            if(pin.length === 6) {
                const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                const data = await res.json();
                if(data[0].Status === "Success") {
                    document.getElementById('locality').value = data[0].PostOffice[0].Name;
                }
            }
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const phone = document.getElementById('authPhone').value;
            
            const body = isSignUp ? { email, password, phone } : { email, password };

            const res = await fetch(isSignUp ? '/api/signup' : '/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('userEmail', data.email);
                localStorage.setItem('userCoins', data.coins);
                location.reload();
            } else { alert(data.error); }
        }

        async function submitProperty() {
            const email = localStorage.getItem('userEmail');
            if(!email) return alert("Please Sign In first!");
            const formData = new FormData();
            formData.append('ownerEmail', email);
            formData.append('title', document.getElementById('title').value);
            formData.append('locality', document.getElementById('locality').value);
            formData.append('rent', document.getElementById('rent').value);
            formData.append('phone', document.getElementById('phone').value);
            const files = document.getElementById('multiImages').files;
            for(let i=0; i<files.length; i++) { formData.append('images', files[i]); }
            
            const btn = event.target; btn.innerText = "Uploading..."; btn.disabled = true;
            await fetch('/api/properties', { method: 'POST', body: formData });
            alert("Sent for verification!"); location.reload();
        }

        async function loadProperties() {
            const res = await fetch('/api/properties');
            const props = await res.json();
            const list = document.getElementById('property-list');
            props.forEach(p => {
                list.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden p-4">
                        <img src="${p.images[0]}" class="w-full h-48 object-cover rounded-[1.5rem] mb-4">
                        <h4 class="font-bold text-lg">${p.title}</h4>
                        <p class="text-indigo-600 font-bold">₹${p.rent}</p>
                        <p class="text-slate-400 text-[10px] mb-4">${p.locality}</p>
                        <button class="w-full bg-slate-900 text-white p-3 rounded-xl">Unlock Contact (1 Coin)</button>
                    </div>
                `);
            });
        }

        window.onload = () => {
            const coins = localStorage.getItem('userCoins');
            if(coins !== null) {
                document.getElementById('coinDisplay').classList.remove('hidden');
                document.getElementById('userCoins').innerText = coins;
                document.getElementById('loginBtn').innerText = "Profile";
            }
            loadProperties();
        };
    </script>
</body>
</html>

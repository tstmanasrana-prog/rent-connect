<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .hero-pattern { background-color: #4338ca; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%); }
        #galleryOverlay img { max-height: 80vh; object-fit: contain; }
        .heart-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @media (max-width: 640px) {
            .nav-text { display: none; } 
            .hero-title { font-size: 2.25rem !important; line-height: 2.5rem !important; }
        }
    </style>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-50 px-4 md:px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 md:gap-3">
                <div class="w-8 h-8 md:w-10 md:h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fas fa-home text-sm"></i></div>
                <h1 class="text-lg md:text-xl font-extrabold tracking-tight whitespace-nowrap">Rent<span class="text-indigo-600">Connect</span></h1>
            </div>

            <div class="flex items-center gap-2 md:gap-4 relative">
                <div id="coinDisplay" class="hidden items-center bg-amber-50 border border-amber-200 px-3 py-1.5 md:px-4 md:py-2 rounded-full gap-2 transition">
                    <i class="fas fa-coins text-amber-500 text-xs md:text-sm"></i>
                    <span id="userCoins" class="font-bold text-amber-700 text-xs md:text-sm">0</span>
                </div>
                
                <button onclick="handlePostPropertyClick()" class="bg-indigo-600 text-white px-3 py-2 md:px-5 md:py-2.5 rounded-xl font-bold shadow-lg text-xs md:text-sm whitespace-nowrap hover:bg-indigo-700">
                    <i class="fas fa-plus mr-1 md:mr-2"></i><span class="nav-text">Post Property</span>
                </button>

                <div class="relative">
                    <button id="loginBtn" onclick="handleAuthClick()" class="bg-slate-900 text-white px-3 py-2 md:px-5 md:py-2.5 rounded-xl font-bold shadow-lg text-xs md:text-sm whitespace-nowrap">
                        <i class="fas fa-user-circle mr-1 md:mr-2"></i><span id="loginBtnText">Sign In</span>
                    </button>
                    <div id="userMenu" class="hidden absolute right-0 mt-3 w-48 bg-white border border-slate-100 rounded-2xl shadow-2xl py-2 z-[300]">
                        <a href="dashboard.html" class="block px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50"><i class="fas fa-th-large mr-2 text-indigo-600"></i> Dashboard</a>
                        <button onclick="logout()" class="w-full text-left px-4 py-3 text-sm font-bold text-rose-500 hover:bg-rose-50"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="authModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[500] p-4 backdrop-blur-md">
        <div class="bg-white p-6 md:p-10 rounded-[2.5rem] w-full max-w-md relative shadow-2xl text-center">
            <button onclick="toggleModal('authModal')" class="absolute top-6 right-6 text-slate-300 text-2xl transition hover:text-rose-500">&times;</button>
            <h3 id="authTitle" class="text-2xl md:text-3xl font-black mb-6 text-slate-900">Join RentConnect</h3>
            <div class="space-y-4 text-left">
                <div id="nameFields" class="grid grid-cols-2 gap-4">
                    <input type="text" id="authFirstName" placeholder="First Name" class="bg-slate-50 p-3 md:p-4 rounded-xl outline-none w-full border border-transparent focus:border-indigo-500">
                    <input type="text" id="authLastName" placeholder="Last Name" class="bg-slate-50 p-3 md:p-4 rounded-xl outline-none w-full border border-transparent focus:border-indigo-500">
                </div>
                <input type="email" id="authEmail" placeholder="Email" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none border border-transparent focus:border-indigo-500">
                <input type="text" id="authPhone" placeholder="Mobile" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none border border-transparent focus:border-indigo-500">
                <input type="password" id="authPassword" placeholder="Password" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none border border-transparent focus:border-indigo-500">
                <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white p-3 md:p-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">Continue</button>
                <p class="text-center text-xs md:text-sm mt-4">
                    <button onclick="toggleAuthMode()" class="text-indigo-600 font-bold hover:underline transition">Switch Login / Signup</button>
                </p>
            </div>
        </div>
    </div>

    <div id="postModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[400] p-2 md:p-4 backdrop-blur-md">
        <div class="bg-white p-5 md:p-8 rounded-[2rem] w-full max-w-3xl max-h-[95vh] overflow-y-auto relative shadow-2xl">
            <button onclick="toggleModal('postModal')" class="absolute top-4 right-4 text-slate-400 text-2xl">&times;</button>
            <h3 class="text-2xl md:text-3xl font-black mb-2 text-slate-900">List Property</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mt-6">
                <div class="md:col-span-2"><input type="text" id="title" placeholder="Title" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none border border-transparent focus:border-indigo-500 transition"></div>
                <div class="md:col-span-2"><select id="bhkType" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl border-none outline-none"><option value="1 RK">1 RK</option><option value="1 BHK">1 BHK</option><option value="2 BHK">2 BHK</option><option value="3 BHK">3 BHK</option></select></div>
                
                <div><input type="number" id="pincode" onkeyup="autoFillLocation(this.value)" placeholder="Pincode" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none border focus:border-indigo-500"></div>
                <div><input type="text" id="locality" placeholder="Locality" class="w-full bg-slate-100 p-3 md:p-4 rounded-xl outline-none" readonly></div>
                
                <div><input type="text" id="district" placeholder="District" class="w-full bg-slate-100 p-3 md:p-4 rounded-xl outline-none" readonly></div>
                <div><input type="text" id="state" placeholder="State" class="w-full bg-slate-100 p-3 md:p-4 rounded-xl outline-none" readonly></div>
                
                <div><input type="text" id="houseNo" placeholder="Flat No / Wing" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none"></div>
                <div><input type="text" id="floorNo" placeholder="Floor" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none"></div>
                <div class="md:col-span-2"><input type="text" id="street" placeholder="Street/Landmark" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none"></div>
                
                <div><input type="number" id="rent" placeholder="Monthly Rent" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none"></div>
                <div><input type="text" id="phone" placeholder="Landlord Phone" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl outline-none"></div>
                
                <div class="md:col-span-2">
                    <select id="tenantType" class="w-full bg-slate-50 p-3 md:p-4 rounded-xl border-none outline-none">
                        <option value="">Preferred Tenant</option>
                        <option value="Family">Family Only</option>
                        <option value="Bachelor">Bachelor Only</option>
                        <option value="Anyone">Family / Bachelor</option>
                    </select>
                </div>

                <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 py-2">
                    <select id="furnishing" class="w-full bg-slate-50 p-3 rounded-xl outline-none">
                        <option value="Unfurnished">Unfurnished</option>
                        <option value="Semi-Furnished">Semi-Furnished</option>
                        <option value="Fully Furnished">Fully Furnished</option>
                    </select>
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-2"><input type="checkbox" id="parking" class="w-5 h-5 accent-indigo-600"><label class="text-sm font-bold text-slate-700">Parking</label></div>
                        <div class="flex items-center gap-2"><input type="checkbox" id="water" class="w-5 h-5 accent-indigo-600"><label class="text-sm font-bold text-slate-700">Water</label></div>
                        <div class="flex items-center gap-2"><input type="checkbox" id="gatedSecurity" class="w-5 h-5 accent-indigo-600"><label class="text-sm font-bold text-indigo-600">Gated</label></div>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <input type="file" id="multiImages" multiple class="w-full text-xs text-slate-500 mt-2">
                    <p class="text-[10px] text-indigo-500 font-bold mt-1 ml-1">Tip: Properties with photos of every room get 4x more tenant interest.</p>
                </div>
                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-4 md:p-5 rounded-2xl font-bold shadow-xl hover:bg-indigo-700 transition">Submit Review</button>
            </div>
        </div>
    </div>

    <section class="hero-pattern text-white py-16 md:py-24 px-6 text-center">
        <h2 class="hero-title text-3xl md:text-6xl font-extrabold mb-6 leading-tight">Find your next home <br/><span class="text-indigo-300">without brokerage.</span></h2>
        <div class="bg-white rounded-2xl p-1.5 md:p-2 shadow-2xl flex flex-col md:flex-row gap-2 max-w-3xl mx-auto">
            <input type="text" id="mainPropertySearch" autocomplete="off" oninput="filterProperties()" placeholder="Search Locality..." class="flex-1 px-4 py-3 md:px-6 md:py-4 text-slate-800 rounded-xl outline-none text-base md:text-lg">
            <button onclick="filterProperties()" class="bg-indigo-600 text-white px-6 py-3 md:px-10 md:py-4 rounded-xl font-bold transition">Search</button>
        </div>
    </section>

    <main class="container mx-auto px-4 md:px-6 py-8 md:py-12">
        <h3 class="text-xl md:text-2xl font-bold text-slate-800 mb-6 md:mb-8">Verified Properties</h3>
        <div id="property-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>
    </main>

    <footer class="py-12 text-center border-t border-slate-200 mt-20">
        <p class="text-slate-400 text-xs font-medium">© 2026 - Rent Connect</p>
    </footer>

    <div id="galleryOverlay" class="fixed inset-0 bg-black/95 hidden z-[600] flex flex-col justify-center items-center p-4">
        <button onclick="closeGallery()" class="absolute top-6 right-6 text-white text-4xl">&times;</button>
        <div class="relative w-full max-w-5xl flex items-center justify-center">
            <button onclick="prevImg()" class="absolute left-0 text-white p-4"><i class="fas fa-chevron-left text-2xl"></i></button>
            <img id="galleryImg" src="" class="rounded-xl shadow-2xl max-w-full">
            <button onclick="nextImg()" class="absolute right-0 text-white p-4"><i class="fas fa-chevron-right text-2xl"></i></button>
        </div>
        <p id="galleryCounter" class="text-white/50 mt-6 font-bold"></p>
    </div>

    <script>
        let isSignUp = true;
        let currentPropImages = [];
        let currentImgIdx = 0;

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        function toggleAuthMode() { 
            isSignUp = !isSignUp; 
            document.getElementById('authTitle').innerText = isSignUp ? "Join RentConnect" : "Welcome Back";
            document.getElementById('nameFields').style.display = isSignUp ? "grid" : "none"; 
            document.getElementById('authPhone').style.display = isSignUp ? "block" : "none";
        }

        function handleAuthClick() {
            if(localStorage.getItem('userEmail')) {
                document.getElementById('userMenu').classList.toggle('hidden');
            } else {
                toggleModal('authModal');
            }
        }

        function handlePostPropertyClick() {
            if(!localStorage.getItem('userEmail')) { toggleModal('authModal'); } 
            else { toggleModal('postModal'); }
        }

        async function autoFillLocation(pin) {
            if(pin.length === 6) {
                const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                const data = await res.json();
                if(data[0].Status === "Success") {
                    document.getElementById('locality').value = data[0].PostOffice[0].Name;
                    document.getElementById('district').value = data[0].PostOffice[0].District;
                    document.getElementById('state').value = data[0].PostOffice[0].State;
                }
            }
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const firstName = document.getElementById('authFirstName').value;
            const lastName = document.getElementById('authLastName').value;
            const phone = document.getElementById('authPhone').value;

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }
            if (isSignUp && (!firstName || !lastName || !phone)) {
                alert("Please fill in your name and mobile number to sign up.");
                return;
            }

            const body = { firstName, lastName, email, password, phone };
            const res = await fetch(isSignUp ? '/api/signup' : '/api/login', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(body) 
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('userName', data.firstName);
                localStorage.setItem('userEmail', data.email);
                localStorage.setItem('userCoins', data.coins);
                localStorage.setItem('unlocked', JSON.stringify(data.unlocked || []));
                localStorage.setItem('wishlist', JSON.stringify(data.wishlist || []));
                location.reload();
            } else { alert(data.error); }
        }

        async function submitProperty() {
            const title = document.getElementById('title').value;
            const rent = document.getElementById('rent').value;
            const phone = document.getElementById('phone').value;
            const pincode = document.getElementById('pincode').value;
            const houseNo = document.getElementById('houseNo').value;
            const floorNo = document.getElementById('floorNo').value;
            const street = document.getElementById('street').value;
            const tenantType = document.getElementById('tenantType').value;
            const images = document.getElementById('multiImages').files;

            // MANDATORY FIELD VALIDATION
            if(!title || !rent || !phone || !pincode || !houseNo || !floorNo || !street || !tenantType) {
                alert("Please fill in all details, including preferred tenant type.");
                return;
            }
            if(images.length === 0) {
                alert("Please select at least one image.");
                return;
            }

            const formData = new FormData();
            formData.append('ownerEmail', localStorage.getItem('userEmail'));
            formData.append('title', title);
            formData.append('bhkType', document.getElementById('bhkType').value);
            formData.append('locality', document.getElementById('locality').value);
            formData.append('district', document.getElementById('district').value);
            formData.append('state', document.getElementById('state').value);
            formData.append('pincode', pincode);
            formData.append('houseNo', houseNo);
            formData.append('floorNo', floorNo);
            formData.append('street', street);
            formData.append('rent', rent);
            formData.append('phone', phone);
            formData.append('tenantType', tenantType);
            formData.append('furnishing', document.getElementById('furnishing').value);
            formData.append('parking', document.getElementById('parking').checked);
            formData.append('water', document.getElementById('water').checked);
            formData.append('gatedSecurity', document.getElementById('gatedSecurity').checked);
            
            for(let i=0; i<images.length; i++) formData.append('images', images[i]);
            
            const res = await fetch('/api/properties', { method: 'POST', body: formData });
            const data = await res.json();
            if(res.ok) { alert("Listing sent for verification!"); location.reload(); } 
            else { alert(data.error); }
        }

        async function loadData() {
            const userEmail = localStorage.getItem('userEmail');
            if(userEmail) {
                const syncRes = await fetch(`/api/user-sync/${userEmail}`);
                const syncData = await syncRes.json();
                if(syncRes.ok) {
                    localStorage.setItem('userCoins', syncData.coins);
                    localStorage.setItem('unlocked', JSON.stringify(syncData.unlocked));
                    localStorage.setItem('wishlist', JSON.stringify(syncData.wishlist));
                    document.getElementById('coinDisplay').classList.remove('hidden');
                    document.getElementById('coinDisplay').classList.add('flex');
                    document.getElementById('userCoins').innerText = syncData.coins;
                    document.getElementById('loginBtnText').innerText = localStorage.getItem('userName');
                }
            }

            const res = await fetch('/api/properties');
            const props = await res.json();
            const list = document.getElementById('property-list');
            const unlockedList = JSON.parse(localStorage.getItem('unlocked') || "[]");
            const wishlist = JSON.parse(localStorage.getItem('wishlist') || "[]");
            list.innerHTML = '';
            
            props.forEach(p => {
                const isUnlocked = unlockedList.includes(p._id);
                const isWishlisted = wishlist.includes(p._id);
                const imgsData = encodeURIComponent(JSON.stringify(p.images));

                list.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden p-4 relative">
                        <div onclick="openGallery('${imgsData}')" class="relative cursor-pointer group mb-4">
                            <img src="${p.images[0]}" class="w-full h-48 md:h-56 object-cover rounded-2xl group-hover:opacity-95 transition">
                            <div class="absolute top-3 left-3 bg-white/90 text-indigo-600 text-[10px] px-3 py-1 rounded-full font-black uppercase">${p.bhkType}</div>
                            <div class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] px-3 py-1.5 rounded-full font-bold">Vacant: ${p.vacantDate}</div>
                            <button onclick="event.stopPropagation(); toggleWishlist('${p._id}')" class="heart-btn absolute bottom-3 right-3 z-10 w-10 h-10 bg-white/95 rounded-full flex items-center justify-center shadow-lg hover:scale-110">
                                <i class="${isWishlisted ? 'fas' : 'far'} fa-heart text-${isWishlisted ? 'rose-500' : 'slate-400'}"></i>
                            </button>
                        </div>
                        <h4 class="font-bold text-lg text-slate-800 truncate px-1">${p.title}</h4>
                        <div class="flex justify-between items-center mt-1 mb-3 px-1">
                            <p class="text-indigo-600 font-extrabold text-xl">₹${p.rent}</p>
                            <p class="text-slate-400 text-xs font-semibold">${p.locality}</p>
                        </div>
                        <div class="flex flex-wrap gap-1.5 mb-4 px-1 text-[9px] font-bold">
                             <span class="bg-slate-50 px-2 py-1 rounded-full border text-slate-500 uppercase">${p.furnishing}</span>
                             <span class="bg-indigo-50 px-2 py-1 rounded-full border border-indigo-100 text-indigo-600 uppercase">For: ${p.tenantType || 'All'}</span>
                             ${p.parking ? '<span class="bg-emerald-50 px-2 py-1 rounded-full border border-emerald-100 text-emerald-600">Parking</span>' : ''}
                             ${p.gatedSecurity ? '<span class="bg-indigo-50 px-2 py-1 rounded-full border border-indigo-100 text-indigo-600">Gated Society</span>' : ''}
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold mb-4 px-1"><i class="fas fa-heart text-rose-400 mr-1 text-[9px]"></i> ${p.likesCount || 0} interested</p>
                        ${isUnlocked ? `
                            <div class="space-y-2">
                                <button onclick="window.open('https://wa.me/${p.phone}')" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold shadow-lg transition flex items-center justify-center gap-2 hover:bg-green-700">
                                    <i class="fab fa-whatsapp"></i> ${p.phone}
                                </button>
                                <button onclick="reportBroker('${p._id}')" class="w-full text-slate-400 text-[10px] font-bold py-1 hover:text-rose-500 transition">Report Broker</button>
                            </div>
                        ` : `
                            <button onclick="unlockContact(event, '${p.phone}', '${p._id}')" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold shadow-lg transition hover:bg-indigo-600">Unlock Contact (1 Coin)</button>
                        `}
                    </div>
                `);
            });
        }

        // Shared functionality for Modal switching and Gallery
        function openGallery(imagesJson) { currentPropImages = JSON.parse(decodeURIComponent(imagesJson)); currentImgIdx = 0; updateGalleryUI(); document.getElementById('galleryOverlay').classList.remove('hidden'); }
        function closeGallery() { document.getElementById('galleryOverlay').classList.add('hidden'); }
        function updateGalleryUI() { document.getElementById('galleryImg').src = currentPropImages[currentImgIdx]; document.getElementById('galleryCounter').innerText = `Image ${currentImgIdx + 1} of ${currentPropImages.length}`; }
        function nextImg() { currentImgIdx = (currentImgIdx + 1) % currentPropImages.length; updateGalleryUI(); }
        function prevImg() { currentImgIdx = (currentImgIdx - 1 + currentPropImages.length) % currentPropImages.length; updateGalleryUI(); }

        function filterProperties() {
            const term = document.getElementById('mainPropertySearch').value.toLowerCase();
            document.querySelectorAll('#property-list > div').forEach(card => { 
                card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none"; 
            });
        }
        
        window.onload = loadData;
    </script>
</body>
</html>

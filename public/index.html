<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .hero-pattern { background-color: #4338ca; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%); }
        .admin-only { display: none; }
        .admin-mode .admin-only { display: block; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="glass-nav border-b sticky top-0 z-50 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold">Rent<span class="text-indigo-600">Connect</span></h1>
            <div class="flex items-center gap-4">
                <div id="coinDisplay" class="hidden flex items-center bg-amber-50 px-4 py-2 rounded-full gap-2 border border-amber-200">
                    <i class="fas fa-coins text-amber-500"></i><span id="userCoins" class="font-bold text-amber-700">0</span>
                </div>
                <button onclick="toggleModal('postModal')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm">Post</button>
                <button onclick="toggleModal('authModal')" id="loginBtn" class="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-sm">Sign In</button>
            </div>
        </div>
    </nav>

    <section class="hero-pattern text-white py-20 px-6 text-center">
        <h2 class="text-4xl md:text-5xl font-extrabold mb-6">Direct Rentals in Baripada</h2>
        <div class="bg-white rounded-2xl p-2 shadow-2xl flex flex-col md:flex-row gap-2 max-w-3xl mx-auto">
            <input type="text" id="searchInput" oninput="filterProperties()" placeholder="Locality or Pincode..." class="flex-1 px-6 py-4 text-slate-800 outline-none rounded-xl">
            <button onclick="filterProperties()" class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold">Search</button>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <section id="adminSection" class="admin-only mt-20 pt-10 border-t">
            <h2 class="text-xl font-bold mb-4 text-indigo-600">Admin Panel</h2>
            <div id="pending-list" class="grid grid-cols-1 gap-4"></div>
        </section>
    </main>

    <div id="authModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[100] p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md relative">
            <button onclick="toggleModal('authModal')" class="absolute top-6 right-6 text-2xl">&times;</button>
            <h3 id="authTitle" class="text-2xl font-black mb-6">Create Account</h3>
            <div class="space-y-4">
                <div id="nameFields" class="grid grid-cols-2 gap-4">
                    <input type="text" id="authFirstName" placeholder="First Name" class="bg-slate-50 p-4 rounded-xl outline-none">
                    <input type="text" id="authLastName" placeholder="Last Name" class="bg-slate-50 p-4 rounded-xl outline-none">
                </div>
                <input type="email" id="authEmail" placeholder="Email" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <input type="text" id="authPhone" placeholder="Mobile" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <input type="password" id="authPassword" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">Continue</button>
                <button onclick="toggleAuthMode()" class="w-full text-indigo-600 text-sm font-bold mt-2">Switch Login/Signup</button>
            </div>
        </div>
    </div>

    <div id="postModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[100] p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-6 text-center">List Your Property</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="title" placeholder="Title" class="md:col-span-2 bg-slate-50 p-4 rounded-xl outline-none">
                <input type="number" id="pincode" onkeyup="autoFill(this.value)" placeholder="Pincode" class="bg-slate-50 p-4 rounded-xl outline-none">
                <input type="text" id="locality" placeholder="Locality" class="bg-slate-100 p-4 rounded-xl outline-none" readonly>
                <input type="text" id="phone" placeholder="WhatsApp" class="bg-slate-50 p-4 rounded-xl outline-none">
                <input type="number" id="rent" placeholder="Rent (₹)" class="bg-slate-50 p-4 rounded-xl outline-none">
                <input type="file" id="multiImages" multiple class="md:col-span-2 text-sm">
                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-4 rounded-xl font-bold">Submit (Earn 3 Coins)</button>
            </div>
        </div>
    </div>

    <footer class="py-10 text-center text-slate-400">
        <p class="text-xs">© 2026 Soul Shift Media</p>
        <button onclick="enterAdmin()" class="text-[10px] mt-2 opacity-20">Admin Login</button>
    </footer>

    <script>
        let isSignUp = true;
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('nameFields').style.display = isSignUp ? "grid" : "none";
            document.getElementById('authPhone').style.display = isSignUp ? "block" : "none";
            document.getElementById('authTitle').innerText = isSignUp ? "Create Account" : "Welcome Back";
        }

        async function autoFill(pin) {
            if(pin.length === 6) {
                const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                const data = await res.json();
                if(data[0].Status === "Success") document.getElementById('locality').value = data[0].PostOffice[0].Name;
            }
        }

        async function handleAuth() {
            const body = {
                firstName: document.getElementById('authFirstName').value,
                lastName: document.getElementById('authLastName').value,
                email: document.getElementById('authEmail').value,
                password: document.getElementById('authPassword').value,
                phone: document.getElementById('authPhone').value
            };
            const res = await fetch(isSignUp ? '/api/signup' : '/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('userName', data.firstName);
                localStorage.setItem('userCoins', data.coins);
                localStorage.setItem('userEmail', data.email);
                location.reload();
            } else { alert(data.error); }
        }

        async function submitProperty() {
            const formData = new FormData();
            formData.append('ownerEmail', localStorage.getItem('userEmail'));
            formData.append('title', document.getElementById('title').value);
            formData.append('locality', document.getElementById('locality').value);
            formData.append('pincode', document.getElementById('pincode').value);
            formData.append('rent', document.getElementById('rent').value);
            formData.append('phone', document.getElementById('phone').value);
            const files = document.getElementById('multiImages').files;
            for(let i=0; i<files.length; i++) formData.append('images', files[i]);
            await fetch('/api/properties', { method: 'POST', body: formData });
            alert("Submitted for verification!"); location.reload();
        }

        function filterProperties() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#property-list > div').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
            });
        }

        async function loadData() {
            const res = await fetch('/api/properties');
            const props = await res.json();
            const list = document.getElementById('property-list');
            props.forEach(p => {
                list.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-[2rem] shadow-sm p-4 overflow-hidden border">
                        <div class="relative">
                            <img src="${p.images[0]}" class="w-full h-48 object-cover rounded-2xl mb-4">
                            <span class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] px-3 py-1 rounded-full font-bold">Vacant: ${p.vacantDate}</span>
                        </div>
                        <h4 class="font-bold">${p.title}</h4>
                        <p class="text-indigo-600 font-bold mb-4">₹${p.rent} | ${p.locality}</p>
                        <button onclick="unlockContact(event, '${p.phone}')" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold">Unlock Contact (1 Coin)</button>
                    </div>
                `);
            });

            if(document.body.classList.contains('admin-mode')) {
                const adminRes = await fetch('/api/admin/pending');
                const pending = await adminRes.json();
                const pList = document.getElementById('pending-list');
                pending.forEach(p => {
                    pList.insertAdjacentHTML('beforeend', `
                        <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-200">
                            <p class="font-bold">${p.title} (${p.phone})</p>
                            <button onclick="verifyProp('${p._id}')" class="mt-4 w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">Verify & Reward 3 Coins</button>
                        </div>
                    `);
                });
            }
        }

        function enterAdmin() {
            if(prompt("Admin Password:") === "soulshift2026") {
                document.body.classList.add('admin-mode');
                loadData();
                document.getElementById('adminSection').scrollIntoView({ behavior: 'smooth' });
            }
        }

        async function verifyProp(id) {
            const dateInput = document.createElement('input');
            dateInput.type = 'date';
            dateInput.onchange = async () => {
                await fetch(`/api/admin/verify/${id}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ vacantDate: dateInput.value }) });
                let c = parseInt(localStorage.getItem('userCoins') || 0);
                localStorage.setItem('userCoins', c + 3);
                location.reload();
            };
            dateInput.click();
        }

        function unlockContact(e, phone) {
            let c = parseInt(localStorage.getItem('userCoins') || 0);
            if(c < 1) return alert("You need 1 coin!");
            if(confirm("Spend 1 coin?")) {
                localStorage.setItem('userCoins', c - 1);
                e.target.innerHTML = `<i class="fab fa-whatsapp mr-2"></i> ${phone}`;
                e.target.className = "w-full bg-green-600 text-white p-4 rounded-xl font-bold";
                e.target.onclick = () => window.open(`https://wa.me/${phone}`);
                document.getElementById('userCoins').innerText = c - 1;
            }
        }

        window.onload = () => {
            const name = localStorage.getItem('userName');
            if(name) {
                document.getElementById('coinDisplay').classList.remove('hidden');
                document.getElementById('userCoins').innerText = localStorage.getItem('userCoins');
                document.getElementById('loginBtn').innerText = `Hi, ${name}`;
            }
            loadData();
        };
    </script>
</body>
</html>

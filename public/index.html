<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .hero-pattern { background-color: #4338ca; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="glass-nav border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-home"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight">Rent<span class="text-indigo-600">Connect</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="coinDisplay" class="hidden md:flex items-center bg-amber-50 border border-amber-200 px-4 py-2 rounded-full gap-2">
                    <i class="fas fa-coins text-amber-500"></i>
                    <span class="font-bold text-amber-700" id="userCoins">0 Coins</span>
                </div>
                
                <button onclick="toggleModal('postModal')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">
                    <i class="fas fa-plus mr-2"></i>Post Property
                </button>

                <button onclick="toggleModal('authModal')" id="loginBtn" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-slate-800 transition">
                    Sign In
                </button>
            </div>
        </div>
    </nav>

    <section class="hero-pattern text-white py-20 px-6">
        <div class="container mx-auto text-center max-w-4xl">
            <h2 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">
                Find your next home <br/><span class="text-indigo-300">without brokerage.</span>
            </h2>
            <p class="text-indigo-100 text-lg mb-10 opacity-80">Access verified owner contacts directly across India.</p>
            
            <div class="bg-white rounded-2xl p-2 shadow-2xl flex flex-col md:flex-row gap-2 max-w-3xl mx-auto">
                <input type="text" id="searchInput" onkeyup="filterProperties()" placeholder="Enter City, Locality or Pincode..." 
                       class="flex-1 px-6 py-4 text-slate-800 rounded-xl outline-none text-lg">
                <button class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-indigo-700 transition">Search</button>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div class="mb-10">
            <h3 class="text-2xl font-bold text-slate-800" id="resultCount">Verified Listings</h3>
            <p class="text-slate-500 text-sm mt-1">Direct from owners, verified by Soul Shift Media.</p>
        </div>

        <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="postModal" class="fixed inset-0 bg-slate-900/80 hidden flex justify-center items-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-slate-800">List Your Property</h3>
                <button onclick="toggleModal('postModal')" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Title</label>
                    <input type="text" id="title" placeholder="e.g. Modern 2BHK with Balcony" class="w-full bg-slate-50 p-4 rounded-xl outline-none focus:ring-2 ring-indigo-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Pincode</label>
                    <input type="number" id="pincode" onkeyup="autoFillAddress(this.value)" placeholder="6 digits" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Locality/City</label>
                    <input type="text" id="locality" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none cursor-not-allowed" readonly>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Owner WhatsApp</label>
                    <input type="text" id="phone" placeholder="91XXXXXXXXXX" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Rent (₹)</label>
                    <input type="number" id="rent" placeholder="Rent per month" class="w-full bg-slate-50 p-4 rounded-xl outline-none">
                </div>

                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Property Photos (Up to 12)</label>
                    <input type="file" id="multiImages" multiple class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-50 file:text-indigo-700">
                </div>

                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-xl hover:bg-indigo-700 transition mt-4">
                    Submit for Verification
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        async function autoFillAddress(pin) {
            if(pin.length === 6) {
                const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                const data = await res.json();
                if(data[0].Status === "Success") {
                    const postOffice = data[0].PostOffice[0];
                    document.getElementById('locality').value = `${postOffice.Name}, ${postOffice.District}`;
                }
            }
        }

        async function loadProperties() {
            const res = await fetch('/api/properties');
            const props = await res.json();
            const list = document.getElementById('property-list');
            list.innerHTML = '';

            props.forEach(p => {
                const card = `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden group hover:shadow-2xl transition-all duration-500">
                        <div class="relative h-60 overflow-hidden">
                            <img src="${p.images[0] || 'https://via.placeholder.com/400x300'}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                            <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur px-4 py-2 rounded-xl text-indigo-900 font-extrabold">
                                ₹${p.rent}
                            </div>
                        </div>
                        <div class="p-8">
                            <h4 class="text-xl font-extrabold text-slate-800 mb-1">${p.title}</h4>
                            <p class="text-slate-400 text-xs mb-6"><i class="fas fa-map-marker-alt"></i> ${p.locality}</p>
                            <button class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold hover:bg-indigo-600 transition">
                                <i class="fas fa-lock mr-2"></i> Unlock Contact (1 Coin)
                            </button>
                        </div>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', card);
            });
        }

        async function submitProperty() {
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('pincode', document.getElementById('pincode').value);
            formData.append('locality', document.getElementById('locality').value);
            formData.append('rent', document.getElementById('rent').value);
            formData.append('phone', document.getElementById('phone').value);
            
            const files = document.getElementById('multiImages').files;
            for(let i=0; i<files.length; i++) { formData.append('images', files[i]); }

            const btn = event.target;
            btn.innerText = "Uploading Photos...";
            btn.disabled = true;

            await fetch('/api/properties', { method: 'POST', body: formData });
            alert("Listing sent to Soul Shift Media for verification!");
            toggleModal('postModal');
            loadProperties();
        }

        loadProperties();
    </script>
</body>
</html>

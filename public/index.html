<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .coin-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .hidden-section { display: none; }
        .auth-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="glass-nav border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight">Rent<span class="text-indigo-600">Connect</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center bg-amber-50 border border-amber-200 px-4 py-2 rounded-full gap-2">
                    <i class="fas fa-coins text-amber-500"></i>
                    <span class="font-bold text-amber-700" id="userCoins">3 Coins</span>
                    <button onclick="openPaymentModal()" class="ml-2 bg-amber-500 text-white w-6 h-6 rounded-full text-xs hover:bg-amber-600">+</button>
                </div>
                
                <button onclick="toggleModal('postModal')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">
                    <i class="fas fa-plus mr-2"></i>Post
                </button>

                <button onclick="toggleModal('authModal')" id="loginBtn" class="border border-slate-200 px-5 py-2.5 rounded-xl font-bold hover:bg-slate-50 transition">
                    Sign In
                </button>
            </div>
        </div>
    </nav>

    <section class="bg-indigo-900 text-white py-12 px-6">
        <div class="container mx-auto text-center max-w-3xl">
            <h2 class="text-3xl md:text-5xl font-extrabold mb-6">Direct Owner Properties.</h2>
            <div class="bg-white rounded-2xl p-2 shadow-2xl flex flex-col md:flex-row gap-2">
                <input type="text" id="searchInput" onkeyup="filterProperties()" placeholder="Search Baripada, 2BHK, etc..." class="flex-1 px-6 py-4 text-slate-800 rounded-xl outline-none">
                <button class="bg-indigo-600 px-8 py-4 rounded-xl font-bold hover:bg-indigo-700 transition">Search</button>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h3 class="text-2xl font-bold text-slate-800">Verified Listings</h3>
                <p class="text-slate-500 text-sm">Verified by Soul Shift Media Team</p>
            </div>
        </div>

        <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="postModal" class="fixed inset-0 auth-overlay hidden flex justify-center items-center z-[100] p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black">List Your Property</h3>
                <button onclick="toggleModal('postModal')" class="text-slate-400 text-2xl">&times;</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Property Title</label>
                    <input type="text" id="title" placeholder="e.g. Spacious 2BHK near Station" class="w-full bg-slate-50 p-4 rounded-xl border-none outline-none focus:ring-2 ring-indigo-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Pincode</label>
                    <input type="number" id="pincode" onkeyup="autoFillAddress(this.value)" placeholder="757001" class="w-full bg-slate-50 p-4 rounded-xl border-none outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Locality</label>
                    <input type="text" id="locality" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none cursor-not-allowed" readonly>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">District</label>
                    <input type="text" id="district" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none cursor-not-allowed" readonly>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">State</label>
                    <input type="text" id="state" class="w-full bg-slate-100 p-4 rounded-xl border-none outline-none cursor-not-allowed" readonly>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Owner Number</label>
                    <input type="text" id="phone" placeholder="91XXXXXXXXXX" class="w-full bg-slate-50 p-4 rounded-xl border-none outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Rent (₹)</label>
                    <input type="number" id="rent" placeholder="5000" class="w-full bg-slate-50 p-4 rounded-xl border-none outline-none">
                </div>

                <div class="md:col-span-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Upload Photos (Up to 12)</label>
                    <div class="border-2 border-dashed border-slate-200 p-6 rounded-2xl text-center">
                        <input type="file" id="multiImages" multiple accept="image/*" class="text-sm">
                        <p class="text-[10px] text-slate-400 mt-2">Professional photos get 2x more leads</p>
                    </div>
                </div>

                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-5 rounded-2xl font-bold shadow-xl hover:bg-indigo-700 transition">
                    Submit for Verification
                </button>
                <p class="md:col-span-2 text-center text-xs text-slate-400 italic">Our team will call you within 24 hours to verify and set a vacant date.</p>
            </div>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 auth-overlay hidden flex justify-center items-center z-[200] p-4">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
            <h3 class="text-3xl font-black mb-2">Join RentConnect</h3>
            <p class="text-slate-500 mb-8">Get 3 free coins on your first sign up.</p>
            <div class="space-y-4">
                <input type="email" placeholder="Email Address" class="w-full bg-slate-50 p-4 rounded-xl border-none outline-none">
                <input type="password" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-xl border-none outline-none">
                <button class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold">Continue</button>
            </div>
        </div>
    </div>

    <script>
        let allProperties = [];

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        // SMART PINCODE LOGIC
        async function autoFillAddress(pin) {
            if(pin.length === 6) {
                const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                const data = await res.json();
                if(data[0].Status === "Success") {
                    const postOffice = data[0].PostOffice[0];
                    document.getElementById('locality').value = postOffice.Name;
                    document.getElementById('district').value = postOffice.District;
                    document.getElementById('state').value = postOffice.State;
                }
            }
        }

        async function loadProperties() {
            const res = await fetch('/api/properties');
            allProperties = await res.json();
            displayProperties(allProperties);
        }

        function displayProperties(props) {
            const list = document.getElementById('property-list');
            list.innerHTML = '';

            props.forEach(p => {
                const isVerified = p.status === 'verified';
                const card = `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden group hover:shadow-2xl transition-all duration-500">
                        <div class="relative h-64 overflow-hidden">
                            <img src="${p.image || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=800'}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                            <div class="absolute top-5 left-5">
                                ${isVerified ? '<span class="bg-green-500 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase"><i class="fas fa-check-circle"></i> Verified</span>' : '<span class="bg-amber-500 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest">Pending</span>'}
                            </div>
                            <div class="absolute bottom-5 left-5 bg-white/90 backdrop-blur px-4 py-2 rounded-xl text-indigo-900 font-extrabold shadow-lg">
                                ₹${p.rent} <span class="text-[10px] opacity-60">/month</span>
                            </div>
                        </div>
                        <div class="p-8">
                            <h4 class="text-xl font-extrabold mb-2 text-slate-800">${p.title}</h4>
                            <p class="text-slate-400 text-xs mb-4 flex items-center gap-1"><i class="fas fa-map-marker-alt"></i> ${p.locality}, ${p.district}</p>
                            
                            <div class="bg-slate-50 p-4 rounded-2xl mb-6">
                                <p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Availability</p>
                                <p class="text-sm font-bold text-indigo-600">${p.vacantDate || 'Check after verification'}</p>
                            </div>

                            <button onclick="unlockContact('${p._id}')" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-600 transition shadow-lg">
                                <i class="fas fa-lock"></i> Get Owner Number (1 Coin)
                            </button>
                        </div>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', card);
            });
        }

        async function submitProperty() {
            // Check if user is logged in first (Logic to be added in Phase 2)
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('pincode', document.getElementById('pincode').value);
            formData.append('locality', document.getElementById('locality').value);
            formData.append('district', document.getElementById('district').value);
            formData.append('state', document.getElementById('state').value);
            formData.append('rent', document.getElementById('rent').value);
            formData.append('phone', document.getElementById('phone').value);
            
            // Multiple files logic
            const files = document.getElementById('multiImages').files;
            for(let i=0; i<files.length; i++){
                formData.append('images', files[i]);
            }

            const btn = event.target;
            btn.innerText = "Processing...";
            btn.disabled = true;

            await fetch('/api/properties', { method: 'POST', body: formData });
            
            alert("Success! Your property is submitted for verification. You will receive 3 coins once verified by our team.");
            toggleModal('postModal');
            loadProperties();
        }

        function unlockContact(id) {
            alert("Coin system requires User Login. Coming in the next update!");
        }

        loadProperties();
    </script>
</body>
</html>

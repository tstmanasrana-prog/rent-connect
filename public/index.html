<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentConnect | Soul Shift Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .hero-gradient { background: linear-gradient(135deg, #4338ca 0%, #1e1b4b 100%); }
        .admin-only { display: none; }
        .admin-mode .admin-only { display: block !important; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="glass-effect border-b sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-extrabold tracking-tight">Rent<span class="text-indigo-600">Connect</span></h1>
        <button onclick="toggleModal()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
            + Post Listing
        </button>
    </nav>

    <section class="hero-gradient text-white py-12 px-6">
        <div class="container mx-auto text-center">
            <h2 class="text-3xl md:text-5xl font-extrabold mb-8">Scale Across India.</h2>
            <div class="max-w-4xl mx-auto bg-white rounded-2xl p-2 shadow-2xl flex flex-col md:flex-row gap-2">
                <input type="text" id="searchInput" onkeyup="filterProperties()" placeholder="Search City, Locality, or BHK..." class="flex-1 px-6 py-4 text-gray-800 rounded-xl outline-none">
                <select id="priceFilter" onchange="filterProperties()" class="px-6 py-4 bg-gray-50 text-gray-700 font-semibold rounded-xl outline-none border-none">
                    <option value="all">Any Rent</option>
                    <option value="5000">Under 5k</option>
                    <option value="15000">Under 15k</option>
                </select>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div id="property-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/70 hidden flex justify-center items-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-2xl max-h-[95vh] overflow-y-auto">
            <h3 class="text-2xl font-bold mb-6 text-indigo-900">Property Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="title" placeholder="Listing Title" class="md:col-span-2 bg-gray-50 p-4 rounded-xl outline-none border border-gray-100">
                <input type="number" id="rent" placeholder="Rent (₹)" class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <input type="text" id="phone" placeholder="WhatsApp (91...)" class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <select id="category" class="bg-gray-50 p-4 rounded-xl"><option value="1BHK">1 BHK</option><option value="2BHK">2 BHK</option><option value="3BHK">3 BHK</option></select>
                <select id="type" class="bg-gray-50 p-4 rounded-xl"><option value="Family">Family</option><option value="Bachelor">Bachelor</option></select>
                
                <input type="text" id="houseNo" placeholder="House/Plot No" class="bg-gray-50 p-4 rounded-xl">
                <input type="text" id="apartment" placeholder="Apartment Name" class="bg-gray-50 p-4 rounded-xl">
                <input type="text" id="locality" placeholder="Locality" class="bg-gray-50 p-4 rounded-xl">
                <input type="text" id="district" placeholder="District/City" class="bg-gray-50 p-4 rounded-xl">
                <input type="text" id="state" placeholder="State" class="md:col-span-2 bg-gray-50 p-4 rounded-xl">

                <div class="md:col-span-2 flex gap-6 py-2 border-y border-gray-100">
                    <label class="flex items-center gap-2 font-semibold text-gray-600"><input type="checkbox" id="hasParking"> Parking</label>
                    <label class="flex items-center gap-2 font-semibold text-gray-600"><input type="checkbox" id="hasLift"> Lift</label>
                    <label class="flex items-center gap-2 font-semibold text-gray-600"><input type="checkbox" id="hasAC"> AC</label>
                </div>

                <div class="md:col-span-2 border-2 border-dashed border-gray-200 p-4 rounded-xl text-center"><input type="file" id="imageInput"></div>
                <button onclick="submitProperty()" class="md:col-span-2 bg-indigo-600 text-white p-4 rounded-2xl font-bold hover:bg-indigo-700 transition">Publish Listing</button>
                <button onclick="toggleModal()" class="md:col-span-2 text-gray-400 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <footer class="py-12 text-center text-gray-400 text-sm border-t mt-12">
        <p>© 2026 Soul Shift Media | Pan-India Expansion</p>
        <button onclick="adminLogin()" class="mt-4 hover:text-indigo-600 flex items-center gap-2 mx-auto">
            <i class="fas fa-lock"></i> Admin Access
        </button>
    </footer>

    <script>
        let allProperties = [];
        function toggleModal() { document.getElementById('modal').classList.toggle('hidden'); }
        async function loadProperties() { const res = await fetch('/api/properties'); allProperties = await res.json(); displayProperties(allProperties); }

        function displayProperties(props) {
            const list = document.getElementById('property-list'); list.innerHTML = '';
            props.forEach(p => {
                const card = `
                    <div class="bg-white rounded-3xl shadow-sm hover:shadow-xl transition-all border border-gray-100 overflow-hidden group relative">
                        <button onclick="deleteProperty('${p._id}')" class="admin-only absolute top-4 right-4 bg-white text-red-500 p-2.5 rounded-xl z-20 shadow-md hover:bg-red-50 transition">
                            <i class="fas fa-trash"></i>
                        </button>
                        
                        <div class="relative h-56">
                            <img src="${p.image || 'https://via.placeholder.com/400x300'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute top-4 left-4 flex gap-2">
                                <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider">${p.category || 'BHK'}</span>
                                <span class="bg-white/90 backdrop-blur text-gray-700 px-3 py-1 rounded-lg text-xs font-bold">${p.type || 'Tenant'}</span>
                            </div>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-center mb-1"><h3 class="text-xl font-bold text-gray-800">${p.title}</h3><p class="text-indigo-600 font-extrabold text-lg">₹${p.rent}</p></div>
                            <p class="text-gray-500 text-sm mb-4"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> ${p.locality}, ${p.district}</p>
                            
                            <div class="flex gap-4 mb-6 text-gray-400 text-sm border-t pt-4">
                                ${p.hasParking ? '<span><i class="fas fa-parking text-blue-500"></i> Parking</span>' : ''}
                                ${p.hasLift ? '<span><i class="fas fa-elevator text-orange-500"></i> Lift</span>' : ''}
                                ${p.hasAC ? '<span><i class="fas fa-snowflake text-cyan-500"></i> AC</span>' : ''}
                            </div>

                            <div class="flex gap-2">
                                <a href="https://wa.me/${p.phone}" class="flex-1 bg-green-500 text-white py-3 rounded-xl font-bold text-center flex items-center justify-center gap-2"><i class="fab fa-whatsapp text-lg"></i> Chat</a>
                                <a href="tel:${p.phone}" class="w-12 h-12 border border-gray-200 rounded-xl flex items-center justify-center text-indigo-600 hover:bg-indigo-50"><i class="fas fa-phone-alt"></i></a>
                            </div>
                        </div>
                    </div>`;
                list.insertAdjacentHTML('beforeend', card);
            });
        }

        function adminLogin() {
            if(prompt("Enter Admin Password:") === "admin123") {
                document.body.classList.add('admin-mode');
                alert("Welcome, Admin! Trash icons are now visible.");
            }
        }

        async function submitProperty() {
            const formData = new FormData();
            const fields = ['title','rent','phone','category','type','houseNo','apartment','locality','district','state'];
            fields.forEach(f => formData.append(f, document.getElementById(f).value));
            formData.append('hasParking', document.getElementById('hasParking').checked);
            formData.append('hasLift', document.getElementById('hasLift').checked);
            formData.append('hasAC', document.getElementById('hasAC').checked);
            formData.append('image', document.getElementById('imageInput').files[0]);
            
            await fetch('/api/properties', { method: 'POST', body: formData });
            toggleModal(); loadProperties();
        }

        function filterProperties() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const p = document.getElementById('priceFilter').value;
            const filtered = allProperties.filter(item => {
                const searchStr = `${item.title} ${item.locality} ${item.district} ${item.category}`.toLowerCase();
                return searchStr.includes(s) && (p === 'all' || item.rent <= p);
            });
            displayProperties(filtered);
        }

        async function deleteProperty(id) { if(confirm('Delete listing?')) { await fetch('/api/properties/' + id, { method: 'DELETE' }); loadProperties(); } }
        loadProperties();
    </script>
</body>
</html>

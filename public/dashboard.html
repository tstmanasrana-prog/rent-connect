<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | RentConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tx-card { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b px-4 md:px-6 py-4 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-sm md:text-base font-extrabold text-slate-900 flex items-center">
                <i class="fas fa-arrow-left mr-2 text-indigo-600"></i> Back to Home
            </a>
            <div class="bg-amber-50 border border-amber-200 px-4 py-2 rounded-full flex items-center gap-2">
                <i class="fas fa-coins text-amber-500"></i>
                <span id="userCoins" class="font-bold text-amber-700">0</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 md:px-6 py-8 md:py-12 max-w-6xl">
        <header class="mb-10">
            <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">Welcome, <span id="userName" class="text-indigo-600">User</span>!</h2>
            <p class="text-slate-500 font-medium">Your personal property command center.</p>
        </header>

        <div class="space-y-12">
            <div>
                <h3 class="text-xl font-bold mb-6 text-rose-500 flex items-center">
                    <i class="fas fa-heart mr-2"></i> Saved Properties
                </h3>
                <div id="wish-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div>
                    <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center">
                        <i class="fas fa-home mr-2 text-indigo-600"></i> My Posted Properties
                    </h3>
                    <div id="my-list" class="space-y-4"></div>
                </div>

                <div>
                    <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center">
                        <i class="fas fa-history mr-2 text-amber-500"></i> Activity Log
                    </h3>
                    <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <div id="tx-list" class="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                            <p class="text-slate-400 italic text-sm text-center py-4">Syncing history...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        const displayName = localStorage.getItem('userName');
        
        if(!userEmail) window.location.href = 'index.html';
        document.getElementById('userName').innerText = displayName || 'User';

        async function loadDashboard() {
            // 1. Sync Coins
            try {
                const syncRes = await fetch(`/api/user-sync/${userEmail}`);
                if (syncRes.ok) {
                    const syncData = await syncRes.json();
                    document.getElementById('userCoins').innerText = syncData.coins || 0;
                }
            } catch (e) { console.error("Sync Error"); }

            // 2. Load My Properties
            try {
                const pRes = await fetch(`/api/my-properties/${userEmail}`);
                const props = await pRes.json();
                const myList = document.getElementById('my-list');
                myList.innerHTML = props.length ? props.map(p => `
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 flex gap-4 items-start shadow-sm hover:shadow-md transition">
                        <img src="${p.images[0]}" class="w-20 h-20 rounded-xl object-cover shadow-inner">
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-800 truncate">${p.title}</p>
                            <p class="text-[10px] text-slate-400 font-bold mb-2 uppercase">${p.district || ''}, ${p.state || ''}</p>
                            <div class="flex flex-wrap gap-2 mb-2">
                                <span class="text-[9px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-bold uppercase">${p.tenantType || 'All'}</span>
                                <span class="text-[9px] bg-slate-50 text-slate-500 px-2 py-0.5 rounded-full font-bold uppercase border">${p.furnishing}</span>
                            </div>
                            <p class="text-[10px] uppercase font-black px-2 py-0.5 rounded-full inline-block ${p.status === 'verified' ? 'bg-green-50 text-green-600' : 'bg-amber-50 text-amber-600'}">${p.status || 'Pending'}</p>
                        </div>
                    </div>
                `).join('') : '<p class="text-slate-400 text-sm italic">No properties posted yet.</p>';
            } catch (e) { console.error("Props Error"); }

            // 3. Load Wishlist
            try {
                const wRes = await fetch(`/api/my-wishlist/${userEmail}`);
                const wishes = await wRes.json();
                const wishListDiv = document.getElementById('wish-list');
                wishListDiv.innerHTML = wishes.length ? wishes.map(p => `
                    <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition">
                        <img src="${p.images[0]}" class="w-full h-32 object-cover rounded-2xl mb-4">
                        <p class="font-bold text-slate-800 truncate text-sm">${p.title}</p>
                        <p class="text-[10px] text-slate-400 font-bold mb-2 uppercase">${p.district || ''}</p>
                        <div class="flex justify-between items-center mt-2">
                            <p class="text-indigo-600 font-extrabold text-sm">₹${p.rent}</p>
                            <span class="text-[8px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-bold uppercase">For: ${p.tenantType || 'All'}</span>
                        </div>
                    </div>
                `).join('') : '<p class="text-slate-400 text-sm italic">Your wishlist is empty.</p>';
            } catch (e) { console.error("Wishlist Error"); }

            // 4. Load Activity Log (Coin History)
            try {
                const tRes = await fetch(`/api/transactions/${userEmail}`);
                const txs = await tRes.json();
                const txListDiv = document.getElementById('tx-list');
                
                if (Array.isArray(txs) && txs.length > 0) {
                    txListDiv.innerHTML = txs.map(t => {
                        // Strict check against server-defined types: 'spent' or 'earned'
                        const isSpent = t.type === 'spent' || t.amount < 0;
                        const amt = Math.abs(t.amount);
                        const date = t.date ? new Date(t.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'}) : 'Recently';
                        
                        return `
                            <div class="flex justify-between items-center py-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 transition px-2 rounded-xl">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center ${isSpent ? 'bg-rose-50 text-rose-500' : 'bg-green-50 text-green-500'}">
                                        <i class="fas ${isSpent ? 'fa-minus' : 'fa-plus'} text-[10px]"></i>
                                    </div>
                                    <div>
                                        <p class="text-[11px] font-bold text-slate-700">${t.description || 'Coin Transaction'}</p>
                                        <p class="text-[9px] text-slate-400 font-medium">${date}</p>
                                    </div>
                                </div>
                                <p class="text-xs font-black ${isSpent ? 'text-rose-500' : 'text-green-600'}">
                                    ${isSpent ? '-' : '+'}${amt}
                                </p>
                            </div>
                        `;
                    }).join('');
                } else {
                    txListDiv.innerHTML = '<div class="text-center py-6"><i class="fas fa-receipt text-slate-200 text-3xl mb-2"></i><p class="text-slate-400 text-sm italic">No history found.</p></div>';
                }
            } catch (err) {
                console.error("TX Error:", err);
                document.getElementById('tx-list').innerHTML = '<p class="text-rose-400 text-xs text-center py-4">History sync failed.</p>';
            }
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>

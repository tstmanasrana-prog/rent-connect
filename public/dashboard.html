<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | RentConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tx-card { transition: all 0.3s ease; }
        .heart-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b px-4 md:px-6 py-4 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-sm md:text-base font-extrabold text-slate-900 flex items-center">
                <i class="fas fa-arrow-left mr-2 text-indigo-600"></i> Back to Home
            </a>
            <div class="bg-amber-50 border border-amber-200 px-4 py-2 rounded-full flex items-center gap-2 shadow-sm">
                <i class="fas fa-coins text-amber-500"></i>
                <span id="userCoins" class="font-bold text-amber-700">0</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 md:px-6 py-8 md:py-12 max-w-6xl">
        <header class="mb-10">
            <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">Welcome, <span id="userName" class="text-indigo-600">User</span>!</h2>
            <p class="text-slate-500 font-medium">Your personal property command center.</p>
        </header>

        <div class="space-y-12">
            <div>
                <h3 class="text-xl font-bold mb-6 text-rose-500 flex items-center">
                    <i class="fas fa-heart mr-2"></i> Saved Properties
                </h3>
                <div id="wish-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                    </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div>
                    <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center">
                        <i class="fas fa-home mr-2 text-indigo-600"></i> My Posted Properties
                    </h3>
                    <div id="my-list" class="space-y-4"></div>
                </div>

                <div>
                    <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center">
                        <i class="fas fa-history mr-2 text-amber-500"></i> Activity Log
                    </h3>
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                        <div id="tx-list" class="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                            <p class="text-slate-400 italic text-sm text-center py-4">Syncing history...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        const displayName = localStorage.getItem('userName');
        
        if(!userEmail) window.location.href = 'index.html';
        document.getElementById('userName').innerText = displayName || 'User';

        async function loadDashboard() {
            // 1. Sync Coins
            try {
                const syncRes = await fetch(`/api/user-sync/${userEmail}`);
                if (syncRes.ok) {
                    const syncData = await syncRes.json();
                    document.getElementById('userCoins').innerText = syncData.coins || 0;
                }
            } catch (e) { console.error("Sync Error"); }

            // 2. My Properties List
            try {
                const pRes = await fetch(`/api/my-properties/${userEmail}`);
                const props = await pRes.json();
                const myList = document.getElementById('my-list');
                myList.innerHTML = props.length ? props.map(p => `
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 flex gap-4 items-start shadow-sm">
                        <img src="${p.images[0]}" class="w-20 h-20 rounded-xl object-cover shadow-inner">
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-800 truncate">${p.title}</p>
                            <p class="text-[10px] text-slate-400 font-bold mb-2 uppercase">${p.district || ''}, ${p.state || ''}</p>
                            <p class="text-[10px] uppercase font-black px-2 py-0.5 rounded-full inline-block ${p.status === 'verified' ? 'bg-green-50 text-green-600' : 'bg-amber-50 text-amber-600'}">${p.status || 'Pending'}</p>
                        </div>
                    </div>
                `).join('') : '<p class="text-slate-400 text-sm italic">No properties posted yet.</p>';
            } catch (e) { console.error("Props Error"); }

            // 3. Saved Properties (With Remove Button)
            try {
                const wRes = await fetch(`/api/my-wishlist/${userEmail}`);
                const wishes = await wRes.json();
                const wishListDiv = document.getElementById('wish-list');
                
                wishListDiv.innerHTML = wishes.length ? wishes.map(p => `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden p-4 relative hover:shadow-md transition">
                        <div class="relative mb-4">
                            <img src="${p.images[0]}" class="w-full h-48 object-cover rounded-2xl shadow-inner">
                            <div class="absolute top-3 left-3 bg-white/90 text-indigo-600 text-[10px] px-3 py-1 rounded-full font-black uppercase">${p.bhkType}</div>
                            <div class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] px-3 py-1.5 rounded-full font-bold">Vacant: ${p.vacantDate}</div>
                            
                            <button onclick="removeFromWishlist('${p._id}')" class="heart-btn absolute bottom-3 right-3 z-10 w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center shadow-lg hover:scale-110 active:scale-125 text-white">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </button>
                        </div>

                        <h4 class="font-bold text-lg text-slate-800 truncate px-1">${p.title}</h4>
                        <div class="flex justify-between items-center mt-1 mb-3 px-1">
                            <p class="text-indigo-600 font-extrabold text-xl">₹${p.rent}</p>
                            <p class="text-slate-400 text-[10px] font-semibold uppercase">${p.locality}</p>
                        </div>
                        
                        <div class="flex flex-wrap gap-1.5 mb-4 px-1 text-[9px] font-bold">
                             <span class="bg-slate-50 px-2 py-1 rounded-full border text-slate-500 uppercase">${p.furnishing}</span>
                             <span class="bg-indigo-50 px-2 py-1 rounded-full border border-indigo-100 text-indigo-600 uppercase">For: ${p.tenantType || 'All'}</span>
                             ${p.parking ? '<span class="bg-emerald-50 px-2 py-1 rounded-full border border-emerald-100 text-emerald-600 uppercase">Parking</span>' : ''}
                             ${p.gatedSecurity ? '<span class="bg-indigo-50 px-2 py-1 rounded-full border border-indigo-100 text-indigo-600 uppercase">Gated Security</span>' : ''}
                        </div>
                        
                        <a href="index.html" class="block w-full text-center bg-slate-900 text-white py-3 rounded-xl font-bold text-xs hover:bg-indigo-600 transition">View on Home</a>
                    </div>
                `).join('') : '<p class="text-slate-400 text-sm italic">Your wishlist is empty.</p>';
            } catch (e) { console.error("Wishlist Error"); }

            // 4. Activity Log
            try {
                const tRes = await fetch(`/api/transactions/${userEmail}`);
                const txs = await tRes.json();
                const txListDiv = document.getElementById('tx-list');
                
                if (Array.isArray(txs) && txs.length > 0) {
                    txListDiv.innerHTML = txs.map(t => {
                        const isSpent = t.type === 'spent' || t.amount < 0;
                        const amt = Math.abs(t.amount);
                        const date = t.date ? new Date(t.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'}) : 'Recently';
                        
                        return `
                            <div class="flex justify-between items-center py-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 transition px-2 rounded-xl">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center ${isSpent ? 'bg-rose-50 text-rose-500' : 'bg-green-50 text-green-500'}">
                                        <i class="fas ${isSpent ? 'fa-minus' : 'fa-plus'} text-[10px]"></i>
                                    </div>
                                    <div>
                                        <p class="text-[11px] font-bold text-slate-700">${t.description || 'Coin Transaction'}</p>
                                        <p class="text-[9px] text-slate-400 font-medium">${date}</p>
                                    </div>
                                </div>
                                <p class="text-xs font-black ${isSpent ? 'text-rose-500' : 'text-green-600'}">
                                    ${isSpent ? '-' : '+'}${amt}
                                </p>
                            </div>
                        `;
                    }).join('');
                } else {
                    txListDiv.innerHTML = '<p class="text-slate-400 text-sm italic text-center py-4">No activity logged.</p>';
                }
            } catch (err) { console.error("TX Error"); }
        }

        async function removeFromWishlist(propId) {
            if(confirm("Remove from saved properties?")) {
                const res = await fetch('/api/wishlist/toggle', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ email: userEmail, propId }) 
                });
                if(res.ok) loadDashboard();
            }
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>

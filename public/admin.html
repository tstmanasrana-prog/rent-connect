<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control | RentConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .status-verified { border-left: 8px solid #22c55e; background: rgba(34, 197, 94, 0.05); }
        .status-rented { border-left: 8px solid #f59e0b; background: rgba(245, 158, 11, 0.05); }
        .status-pending { border-left: 8px solid #6366f1; background: rgba(99, 102, 241, 0.05); }
        .status-reported { border: 2px solid #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; }
        .admin-input { background: #334155; border: 1px solid #475569; padding: 10px; border-radius: 12px; font-size: 13px; color: white; outline: none; width: 100%; }
        .admin-label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="lockScreen" class="fixed inset-0 bg-slate-900 z-[1000] flex flex-col justify-center items-center p-6 text-center">
        <h2 class="text-3xl font-black mb-8">Admin Center</h2>
        <input type="password" id="adminPass" placeholder="Password" class="bg-slate-800 border border-slate-700 p-5 rounded-2xl outline-none mb-6 w-full max-w-xs text-center">
        <button onclick="checkAdmin()" class="bg-indigo-600 px-12 py-4 rounded-2xl font-bold hover:bg-indigo-500 transition">Login</button>
    </div>

    <div id="adminContent" class="hidden">
        <nav class="border-b border-slate-800 p-6 flex justify-between items-center bg-slate-900 sticky top-0 z-50">
            <h1 class="text-xl font-black text-indigo-400">RentConnect Admin</h1>
            <div class="flex gap-4">
                <button onclick="loadPending()" class="bg-indigo-600 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider">Queue</button>
                <button onclick="loadAll()" class="bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider">Inventory</button>
                <button onclick="manualAddCoins()" class="text-slate-400 text-xs font-bold">Topup</button>
            </div>
        </nav>

        <main class="container mx-auto p-6 max-w-6xl">
            <div id="statusHeader" class="mb-10 mt-6"></div>
            <div id="mainList" class="space-y-10"></div>
        </main>
    </div>

    <script>
        function checkAdmin() { if(document.getElementById('adminPass').value === "soulshift2026") { document.getElementById('lockScreen').classList.add('hidden'); document.getElementById('adminContent').classList.remove('hidden'); loadPending(); } }
        
        async function loadPending() {
            const res = await fetch('/api/admin/pending');
            const data = await res.json();
            document.getElementById('statusHeader').innerHTML = `<h2 class="text-3xl font-black">Verification Queue (${data.length})</h2>`;
            const list = document.getElementById('mainList');
            
            list.innerHTML = data.map(p => `
                <div class="bg-slate-800 rounded-[2.5rem] p-8 shadow-2xl status-pending border border-slate-700">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        <div>
                            <div class="grid grid-cols-3 gap-3 mb-6">
                                ${p.images.map(img => `<img src="${img}" class="rounded-2xl aspect-square object-cover cursor-pointer hover:scale-105 transition border-2 border-slate-700" onclick="window.open('${img}')">`).join('')}
                            </div>
                            <div class="bg-slate-900/50 p-6 rounded-3xl space-y-4">
                                <div>
                                    <span class="admin-label">Current Status</span>
                                    <p class="text-indigo-400 font-black uppercase text-sm">${p.status}</p>
                                </div>
                                <div>
                                    <span class="admin-label">Owner Email</span>
                                    <p class="text-slate-300 font-bold text-xs">${p.ownerEmail}</p>
                                </div>
                                <div class="flex flex-wrap gap-2 pt-2">
                                    <span class="text-[10px] font-black px-3 py-1 rounded-full ${p.parking ? 'bg-emerald-500/10 text-emerald-500' : 'bg-slate-700 text-slate-500'}">Parking: ${p.parking ? 'YES' : 'NO'}</span>
                                    <span class="text-[10px] font-black px-3 py-1 rounded-full ${p.water ? 'bg-blue-500/10 text-blue-500' : 'bg-slate-700 text-slate-500'}">Water: ${p.water ? 'YES' : 'NO'}</span>
                                    <span class="text-[10px] font-black px-3 py-1 rounded-full ${p.gatedSecurity ? 'bg-indigo-500/10 text-indigo-500' : 'bg-slate-700 text-slate-500'}">Gated: ${p.gatedSecurity ? 'YES' : 'NO'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="admin-label">Listing Title</label>
                                <input type="text" id="title-${p._id}" value="${p.title}" class="admin-input font-bold text-base">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="admin-label">Locality</label>
                                    <input type="text" id="locality-${p._id}" value="${p.locality}" class="admin-input">
                                </div>
                                <div>
                                    <label class="admin-label">District & State</label>
                                    <input type="text" value="${p.district || ''}, ${p.state || ''}" class="admin-input bg-slate-800" readonly>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white rounded-2xl p-4 text-slate-900 border-2 border-indigo-500">
                                    <p class="text-[10px] font-black uppercase text-indigo-600">WhatsApp / Phone</p>
                                    <input type="text" id="phone-${p._id}" value="${p.phone}" class="text-lg font-black w-full outline-none">
                                </div>
                                <div class="bg-indigo-900/30 rounded-2xl p-4 border border-indigo-500/30">
                                    <p class="text-[10px] font-black uppercase text-indigo-300">Monthly Rent (₹)</p>
                                    <input type="number" id="rent-${p._id}" value="${p.rent}" class="text-lg font-black w-full bg-transparent outline-none text-white">
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="admin-label">House/Flat No</label>
                                    <input type="text" id="houseNo-${p._id}" value="${p.houseNo || ''}" class="admin-input">
                                </div>
                                <div>
                                    <label class="admin-label">Floor</label>
                                    <input type="text" id="floorNo-${p._id}" value="${p.floorNo || ''}" class="admin-input">
                                </div>
                                <div>
                                    <label class="admin-label">BHK Type</label>
                                    <input type="text" value="${p.bhkType}" class="admin-input bg-slate-800" readonly>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="admin-label">Furnishing</label>
                                    <input type="text" value="${p.furnishing}" class="admin-input bg-slate-800" readonly>
                                </div>
                                <div>
                                    <label class="admin-label">Preferred Tenant</label>
                                    <input type="text" value="${p.tenantType || 'Anyone'}" class="admin-input bg-slate-800" readonly>
                                </div>
                            </div>

                            <button onclick="verifyAndSave('${p._id}')" class="w-full bg-green-600 py-5 rounded-2xl font-black text-lg hover:bg-green-500 transition shadow-xl mt-4">
                                <i class="fas fa-check-circle mr-2"></i> Approve & Give 3 Coins
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadAll() {
            const res = await fetch('/api/admin/all-properties');
            const data = await res.json();
            document.getElementById('statusHeader').innerHTML = `<h2 class="text-3xl font-black">Inventory Control (${data.length})</h2>`;
            const list = document.getElementById('mainList');
            list.innerHTML = data.map(p => {
                const statusClass = p.isBrokerReported ? 'status-reported' : `status-${p.status}`;
                const statusColor = p.status === 'verified' ? 'text-green-400' : 'text-amber-400';
                
                // NEW: Logic to display the detailed report reasons
                const reportBox = p.isBrokerReported ? `
                    <div class="mt-4 p-4 bg-rose-500/10 border border-rose-500/20 rounded-2xl w-full">
                        <p class="text-[10px] font-black text-rose-500 uppercase mb-2"><i class="fas fa-exclamation-triangle mr-1"></i> Report Audit Details</p>
                        <div class="flex flex-wrap gap-2 mb-2">
                            ${(p.reportReasons || []).map(r => `<span class="bg-rose-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full">${r}</span>`).join('')}
                        </div>
                        <p class="text-slate-300 text-xs italic">"${p.reportComments || 'No specific comment provided.'}"</p>
                    </div>
                ` : '';

                return `
                    <div class="bg-slate-800 p-6 rounded-3xl mb-4 flex flex-col gap-4 ${statusClass} border border-slate-700">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-4">
                                <img src="${p.images[0]}" class="w-16 h-16 rounded-xl object-cover">
                                <div>
                                    <p class="font-bold text-lg text-white">${p.title} ${p.isBrokerReported ? '<span class="text-rose-500 font-black text-[10px] ml-2 tracking-widest bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/50 uppercase">Reported</span>' : ''}</p>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">${p.locality}, ${p.district}</p>
                                    <p class="text-[10px] uppercase font-black ${statusColor} mt-1">${p.status}</p>
                                </div>
                            </div>
                            <div class="flex gap-2 w-full md:w-auto">
                                <button onclick="toggleStatus('${p._id}', '${p.status==='verified'?'rented':'verified'}')" 
                                        class="flex-1 md:flex-none px-6 py-3 rounded-xl text-xs font-bold uppercase transition ${p.status==='verified'?'bg-amber-600 hover:bg-amber-500':'bg-green-600 hover:bg-green-500'}">
                                    Mark ${p.status==='verified'?'Rented':'Available'}
                                </button>
                                <button onclick="blacklistNumber('${p.phone}')" class="px-6 py-3 rounded-xl text-xs font-bold uppercase bg-rose-600 hover:bg-rose-500 transition">Ban Broker</button>
                                <button onclick="deleteProp('${p._id}')" class="p-3 rounded-xl bg-slate-700 hover:bg-rose-900 transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        ${reportBox}
                    </div>
                `;
            }).join('');
        }

        async function verifyAndSave(id) {
            const date = prompt("Vacant From?", "Available Now"); 
            if(date === null) return; 
            
            const updatedData = { 
                title: document.getElementById(`title-${id}`).value, 
                phone: document.getElementById(`phone-${id}`).value, 
                houseNo: document.getElementById(`houseNo-${id}`).value, 
                floorNo: document.getElementById(`floorNo-${id}`).value, 
                rent: document.getElementById(`rent-${id}`).value, 
                locality: document.getElementById(`locality-${id}`).value,
                vacantDate: date, 
                status: 'verified' 
            };
            
            await fetch(`/api/admin/verify-and-update/${id}`, { 
                method: 'PATCH', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(updatedData) 
            });
            alert("Verification Successful!"); 
            loadPending();
        }

        async function toggleStatus(id, s) { await fetch(`/api/admin/verify-and-update/${id}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ status: s }) }); loadAll(); }
        async function blacklistNumber(phone) { if(confirm("Ban this number?")) { await fetch('/api/admin/blacklist', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phone }) }); alert("Banned."); loadAll(); } }
        async function deleteProp(id) { if(confirm("Delete?")) { await fetch(`/api/admin/delete/${id}`, { method: 'DELETE' }); loadAll(); } }
        async function manualAddCoins() { const email = prompt("User Email:"); const amount = prompt("Amount of Coins:"); if(email && amount) await fetch('/api/admin/add-coins', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, amount: parseInt(amount) }) }); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | RentConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="lockScreen" class="fixed inset-0 bg-slate-900 z-[1000] flex flex-col justify-center items-center p-6">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center mb-6"><i class="fas fa-lock text-white"></i></div>
        <h2 class="text-2xl font-black mb-6">Soul Shift Media Admin</h2>
        <input type="password" id="adminPass" placeholder="Enter Password" class="bg-slate-800 border border-slate-700 p-4 rounded-xl outline-none mb-4 w-full max-w-xs text-center">
        <button onclick="checkAdmin()" class="bg-indigo-600 px-10 py-4 rounded-xl font-bold">Access Dashboard</button>
    </div>

    <div id="adminContent" class="hidden">
        <nav class="border-b border-slate-800 p-6 flex justify-between items-center bg-slate-900 sticky top-0 z-50">
            <h1 class="text-xl font-black text-indigo-400">RentConnect Admin</h1>
            <div class="flex gap-4">
                <button onclick="location.href='index.html'" class="text-slate-400 text-sm font-bold">View Site</button>
                <button onclick="manualAddCoins()" class="bg-indigo-600 px-4 py-2 rounded-lg text-xs font-bold">Manual Credit</button>
            </div>
        </nav>

        <main class="container mx-auto p-6 max-w-6xl">
            <h2 class="text-3xl font-black mb-10">Verification Queue</h2>
            <div id="pendingList" class="space-y-6"></div>
        </main>
    </div>

    <script>
        function checkAdmin() { if(document.getElementById('adminPass').value === "soulshift2026") { document.getElementById('lockScreen').classList.add('hidden'); document.getElementById('adminContent').classList.remove('hidden'); loadPending(); } else { alert("Wrong!"); } }
        async function loadPending() {
            const res = await fetch('/api/admin/pending');
            const data = await res.json();
            const list = document.getElementById('pendingList');
            list.innerHTML = data.length ? '' : '<div class="text-center py-20 text-slate-500">Queue Clear!</div>';
            data.forEach(p => {
                list.insertAdjacentHTML('beforeend', `
                    <div class="bg-slate-800 border border-slate-700 rounded-[2rem] p-8 shadow-2xl overflow-hidden">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <div>
                                <h4 class="text-xs font-black uppercase text-indigo-400 mb-4">Photos Submitted</h4>
                                <div class="grid grid-cols-3 gap-2 overflow-y-auto max-h-[300px]">
                                    ${p.images.map(img => `<img src="${img}" class="rounded-xl aspect-square object-cover border border-slate-700 hover:scale-105 transition cursor-zoom-in" onclick="window.open('${img}')">`).join('')}
                                </div>
                            </div>
                            <div class="space-y-4">
                                <h4 class="text-xs font-black uppercase text-indigo-400 mb-4">Edit Listing</h4>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="title-${p._id}" value="${p.title}" class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 text-sm">
                                    <select id="bhk-${p._id}" class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 text-sm text-white">
                                        <option value="1 RK" ${p.bhkType==='1 RK'?'selected':''}>1 RK</option>
                                        <option value="1 BHK" ${p.bhkType==='1 BHK'?'selected':''}>1 BHK</option>
                                        <option value="2 BHK" ${p.bhkType==='2 BHK'?'selected':''}>2 BHK</option>
                                        <option value="3 BHK" ${p.bhkType==='3 BHK'?'selected':''}>3 BHK</option>
                                    </select>
                                </div>
                                <div class="bg-indigo-500/5 p-4 rounded-2xl border border-indigo-500/20">
                                    <p class="text-[10px] font-bold text-indigo-400 uppercase mb-2">Owner Phone</p>
                                    <input type="text" id="phone-${p._id}" value="${p.phone}" class="bg-white text-slate-900 font-bold p-3 rounded-xl w-full text-lg">
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <input type="text" id="houseNo-${p._id}" value="${p.houseNo}" placeholder="House" class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 text-xs">
                                    <input type="text" id="floorNo-${p._id}" value="${p.floorNo}" placeholder="Floor" class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 text-xs">
                                    <input type="text" id="rent-${p._id}" value="${p.rent}" placeholder="Rent" class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 text-xs">
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="verifyAndSave('${p._id}')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold">Verify Listing</button>
                                    <button onclick="rejectProp('${p._id}')" class="bg-rose-600/20 text-rose-500 px-6 rounded-xl"><i class="fas fa-trash"></i></button>
                                </div>
                                <p class="text-[10px] text-slate-500 text-center uppercase font-bold">Posted by: ${p.ownerEmail}</p>
                            </div>
                        </div>
                    </div>
                `);
            });
        }
        async function verifyAndSave(id) {
            const date = prompt("Vacant Date?", "Available Now"); if(!date) return;
            const updatedData = { title: document.getElementById(`title-${id}`).value, bhkType: document.getElementById(`bhk-${id}`).value, phone: document.getElementById(`phone-${id}`).value, houseNo: document.getElementById(`houseNo-${id}`).value, floorNo: document.getElementById(`floorNo-${id}`).value, rent: document.getElementById(`rent-${id}`).value, vacantDate: date };
            const res = await fetch(`/api/admin/verify-and-update/${id}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(updatedData) });
            if(res.ok) { alert("Done!"); loadPending(); }
        }
        async function rejectProp(id) { if(confirm("Delete?")) { await fetch(`/api/admin/delete/${id}`, { method: 'DELETE' }); loadPending(); } }
        async function manualAddCoins() { const email = prompt("Email:"); const amount = prompt("Amount:"); if(email && amount) await fetch('/api/admin/add-coins', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, amount: parseInt(amount) }) }); }
    </script>
</body>
</html>
